[project]
name = "portfolio-analytics"
version = "0.1.0"
description = "Daily analytics for a Groww stock and mutual fund portfolio"
requires-python = ">=3.10"
dependencies = [
    "growwapi>=1.5",
    "pyotp>=2.9",
    "yfinance>=0.2.50",
    "casparser>=0.7",
    "pandas>=2.0",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
